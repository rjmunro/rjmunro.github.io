<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML → Markdown</title>
  <script src="https://cdn.jsdelivr.net/npm/turndown@7.2.0/dist/turndown.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1117;
      --panel: #1a1d27;
      --border: #2d3344;
      --text: #e8eaef;
      --muted: #8b93a7;
      --accent: #6ea8fe;
      --font: ui-sans-serif, system-ui, -apple-system, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f5f7;
        --panel: #ffffff;
        --border: #d8dce6;
        --text: #1a1d27;
        --muted: #5c6478;
        --accent: #2563eb;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }

    header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
    }

    header p {
      margin: 0.35rem 0 0;
      font-size: 0.85rem;
      color: var(--muted);
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      min-height: 0;
    }

    @media (max-width: 800px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
    }

    .pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-right: 1px solid var(--border);
    }

    .pane:last-child {
      border-right: none;
    }

    .pane-label {
      padding: 0.6rem 1rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    #editor {
      flex: 1;
      padding: 1rem 1.25rem;
      overflow: auto;
      outline: none;
      line-height: 1.55;
      font-size: 0.95rem;
    }

    #editor:empty::before {
      content: "Paste formatted text here…";
      color: var(--muted);
      pointer-events: none;
    }

    #editor:focus {
      box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent);
    }

    #markdown {
      flex: 1;
      width: 100%;
      padding: 1rem 1.25rem;
      border: none;
      resize: none;
      outline: none;
      background: var(--panel);
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.82rem;
      line-height: 1.5;
      tab-size: 2;
    }

    button {
      font: inherit;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: normal;
      text-transform: none;
      padding: 0.25rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 0.35rem;
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    footer {
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
  </style>
</head>
<body>
  <header>
    <h1>HTML → Markdown</h1>
    <p>Paste rich text into the left pane. Markdown updates live on the right.</p>
  </header>

  <main>
    <section class="pane">
      <div class="pane-label">Rich text (paste here)</div>
      <div id="editor" contenteditable="true" spellcheck="true"></div>
    </section>

    <section class="pane">
      <div class="pane-label">
        <span>Markdown</span>
        <button type="button" id="copy-btn" title="Copy markdown to clipboard">Copy</button>
      </div>
      <textarea id="markdown" readonly spellcheck="false" placeholder="Markdown appears here…"></textarea>
    </section>
  </main>

  <footer>Powered by <a href="https://github.com/mixmark-io/turndown" style="color: var(--accent);">Turndown</a></footer>

  <script>
    const editor = document.getElementById("editor");
    const markdown = document.getElementById("markdown");
    const copyBtn = document.getElementById("copy-btn");

    const turndown = new TurndownService({
      headingStyle: "atx",
      bulletListMarker: "-",
      codeBlockStyle: "fenced",
      emDelimiter: "*",
      strongDelimiter: "**",
    });

    // Keep links as markdown links
    turndown.addRule("strikethrough", {
      filter: ["del", "s", "strike"],
      replacement: (content) => "~~" + content + "~~",
    });

    function convert() {
      const html = editor.innerHTML.trim();
      if (!html) {
        markdown.value = "";
        return;
      }
      markdown.value = turndown.turndown(html);
    }

    editor.addEventListener("input", convert);
    editor.addEventListener("paste", () => {
      // Paste inserts content asynchronously; convert on next tick
      requestAnimationFrame(convert);
    });

    copyBtn.addEventListener("click", async () => {
      if (!markdown.value) return;
      try {
        await navigator.clipboard.writeText(markdown.value);
        const original = copyBtn.textContent;
        copyBtn.textContent = "Copied!";
        setTimeout(() => {
          copyBtn.textContent = original;
        }, 1200);
      } catch {
        markdown.select();
        document.execCommand("copy");
      }
    });
  </script>
</body>
</html>
