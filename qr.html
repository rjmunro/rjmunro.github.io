<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: sans-serif;
    background: #fff;
  }
  body {
    display: flex;
    flex-direction: column;
  }
  #controls {
    padding: 8px;
    flex-shrink: 0;
    display: flex;
    gap: 8px;
    align-items: stretch;
  }
  #text {
    flex: 1;
    font-size: 3em;
    padding: 4px 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    min-width: 0;
  }
  #download-btn {
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #f5f5f5;
    white-space: nowrap;
    align-self: center;
  }
  #download-btn:hover {
    background: #e0e0e0;
  }
  #qr-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 8px;
    min-height: 0;
  }
  #qr-container svg {
    max-width: 100%;
    max-height: 100%;
  }
</style>
</head>
<body>
  <div id="controls">
    <input id="text" type="text" placeholder="Enter text to encode as QR code…">
    <button id="download-btn">Download SVG</button>
  </div>
  <div id="qr-container"></div>

  <script type="module">
    import QRCode from 'https://esm.sh/qrcode-svg@1.1.0';

    const textEl = document.getElementById('text');
    const container = document.getElementById('qr-container');
    const downloadBtn = document.getElementById('download-btn');

    function updateQR() {
      const content = textEl.value || ' ';
      try {
        const qr = new QRCode({
          content: content,
          padding: 2,
          width: 1024,
          height: 1024,
          color: '#000000',
          background: '#ffffff',
          ecl: 'M',
          join: true,
          container: 'svg-viewbox',
        });
        container.innerHTML = qr.svg();
      } catch {
        container.innerHTML = '<p style="color:#999">Unable to generate QR code</p>';
      }
    }

    function downloadSVG() {
      const svg = container.querySelector('svg');
      if (!svg) return;
      const svgData = new XMLSerializer().serializeToString(svg);
      const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'qrcode.svg';
      a.click();
      URL.revokeObjectURL(url);
    }

    // Hidden span to measure text width accurately
    const measurer = document.createElement('span');
    measurer.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;';
    document.body.appendChild(measurer);

    function autoSizeText() {
      const maxSize = 3; // em
      const minSize = 1; // em
      const style = getComputedStyle(textEl);
      measurer.style.fontFamily = style.fontFamily;
      measurer.style.fontWeight = style.fontWeight;
      measurer.style.letterSpacing = style.letterSpacing;
      measurer.textContent = textEl.value || textEl.placeholder;

      const availableWidth = textEl.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);

      // Measure at max size first
      measurer.style.fontSize = maxSize + 'em';
      let size = maxSize;
      if (measurer.offsetWidth > availableWidth && availableWidth > 0) {
        size = Math.max(minSize, maxSize * availableWidth / measurer.offsetWidth);
      }
      textEl.style.fontSize = size + 'em';
    }

    textEl.addEventListener('input', () => { autoSizeText(); updateQR(); });
    downloadBtn.addEventListener('click', downloadSVG);
    updateQR();
  </script>
</body>
</html>
